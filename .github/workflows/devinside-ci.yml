# devinside-managed: node@v1
# Generated by DevInside. Manage this workflow from the DevInside dashboard;
# DevInside may update it (e.g. add code-quality or security scanning) via a
# pull request. Editing it by hand can cause update conflicts.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
